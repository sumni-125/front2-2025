<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        /* 안쪽 박스를 정 가운데 배치하기 */
        .outer-box{
            width: 500px;
            height: 500px;
            border: 1px solid black;

            display: flex;
            justify-content: center;

            align-items: center;
        }

        .inner-box{
            width: 200px;
            height: 200px;
            border: 1px solid black;
        }

    </style>
</head>
<body>
    <div class="outer-box">
        <div class="inner-box">

        </div>
    </div>
</body>
</html>

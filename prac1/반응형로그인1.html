<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .wrap {
            border: 1px solid black;
            width: 400px;
            margin: 50px auto;
            padding: 10px;
            box-sizing: border-box;
        }

        .wrap>div {
            border: 1px solid black;
        }

        .field {
            display: flex;
            flex-direction: row;

        }

        .field label {
            flex: 1;
        }

        .field input {
            flex: 4;
        }
        /* 모바일 구간 */
        /*
        
        
        1) 로그인 : 400px -> width 100% (부모의 크기의 100% 의미함, body 는 기준이 뷰포트(장치)의 너비
        2) field영역의 가로배치 -> 세로로 하기
        3) 버튼 크기 주기(100%)



        */
        @media(max-width:768px) {

            .wrap{
                width: 100%;
            }
            .field{
                flex-direction: column;
            }
            .btn{
                width: 100%;
            }

        }
    </style>

</head>

<body>

    <div class="wrap">

        <h2>에이콘 로그인</h2>
        <!--필드영역-->

        <div class="field">
            <label>이름</label><input type="text">
        </div>
        <div class="field">
            <label>아이디</label><input type="password">
        </div>
        <div>
            <button class="btn">로그인</button>
        </div>

    </div>

</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .wrap{
            border: 1px solid black;
            width: 400px;
            margin: 0 auto;
            padding: 10px;
        }
        table, td{
            border: 1px solid black;
            border-collapse: collapse;
        }
        .name{
            width: 70px;
        }
        .input-box{
            width: 340px;

        }
        input{
            width: 100%;
            height: 100%;
            border: none;
            padding: 0;
            margin: 0;
        }
    </style>

</head>
<body>
    
    <div class="wrap">
        <div>
            <h2>에이콘 로그인</h2>
        </div>
        <div>
            <table>
                <tr>
                    <td class="name">이름</td>
                    <td class="input-box"><input type="text"></td>
                </tr>
                <tr>
                    <td class="name">이름</td>
                    <td class="input-box"><input type="text"></td>
                </tr>
                <tr>
                    <td colspan="2"><button>로그인</button></td>
                    
                </tr>
            </table>
        </div>
    </div>

</body>
</html>

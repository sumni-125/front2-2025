<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        .item{
            width: 290px;
            border: 0.5px solid #ccc;
            padding: 10px;
            box-sizing: border-box;
        }

        .item img{
            width: 100%;
        }
        .title{ /*span, a 인라인태그 크기를 가질 ㅜㅅ 없다 input img button 인라인블럭*/
            color: royalblue;

            display: block;
            margin-top:30px ;
        }
        .price{ 
            color: royalblue;
            margin-bottom: 10px;
            display: block;
        }
        .best{ 
            padding: 5px 10px;
            background-color: pink;
            border-radius: 5px;
        }

    </style>
</head>
<body>
    <div class="item">
        <img src="imgs/course-01.png" alt="">

        <h4>자바스크립트</h4>
        <span class="title">웹개발</span>
        <span class="price">61,000</span>
        <span class="best">베스트셀러</span>
    </div>
</body>
</html>

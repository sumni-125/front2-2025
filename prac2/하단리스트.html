    <style>

        .item-wrap{

            width: 1260px;
            display: flex;
            flex-direction: row;

            border: 1px solid black;
            flex-wrap: wrap;
            justify-content: space-between;
        }

        h5,p {
            padding: 0;
            margin: 0;
        }

        .item {
            width: 300px;
            height: 200px;
            border: 1px solid black;

            /*      */
            overflow: hidden;
            position: relative;

            margin-top: 10px;
        }

        img {
            width: 300px;
            height: 200px;
        }

        .desc {
            width: 100%;
            height: 60px;
            border: 1px solid blue;

            /*   부모를기준으로 바닥아래에 위치   */
            position: absolute;
            bottom: -60px;
            left: 0px;

            transition: 0.5s;
        }

        .item:hover .desc {
            bottom: 0px;
        }
    </style>
</head>
